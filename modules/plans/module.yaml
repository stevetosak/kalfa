schema: 1
description: The view of the open work (active and proposed Plans, open Tasks, deferred items, Plan faults) and the capture of deferred work as a deferred item (kalfa defer, private in the Memory home) or a proposed Plan.
needs:
  - capability: context-injection
    without: no deferred items at session start; kalfa defer list still shows them
commands:
  allow:
    - kalfa plan list*
    - kalfa plan show *
    - kalfa plan check
    - kalfa task list
    - kalfa task show*
    - kalfa defer list*
    - kalfa defer show *
