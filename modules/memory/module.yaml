schema: 1
description: Long-term memory. kalfa memory writes, shows and lists the Memory records (add, supersede, confirm, close, show with the linked records, list); keyword search over the Memory records, the Task Records, the project's documentation and the old archives; each layer's Root Hub at session start, with the closed Task Records that missed their Cleanup and the open Tasks with no write for idle-task-days Active days, and recall on the first prompt of a session with the prompt and the branch's Task; at Task close the steps of the Cleanup, which takes the findings of the Remember parts into Long-term memory, with those of a few missed Cleanups, and the move of each reconciled Task Record outside the Short-term window, with its Checkpoints, to the archive in the Memory home; a lint that reports stale, broken and duplicate records and a Root Hub over its limit; kalfa memory migrate, once per repository, marks the closed Task Records from before the Cleanup reconciled and moves those outside the window to the archive. The Core keeps the Memory home and the record format.
needs:
  - capability: context-injection
    without: no Root Hub, no recall on the first prompt and no Cleanup steps at Task close; kalfa memory still works on demand
commands:
  allow:
    - kalfa memory search *
    - kalfa memory lint
    - kalfa memory migrate --dry-run
    - kalfa memory inbox
    - kalfa memory inbox list
    - kalfa memory list*
    - kalfa memory show *
