schema: 1
description: Commands that change infrastructure ask first (every terraform command and the kubectl verbs that write), and a Rule pack of generic Kubernetes, Helm and CloudNativePG rules.
commands:
  ask:
    - terraform *
    - cd * terraform *
    - kubectl apply *
    - kubectl delete *
    - kubectl patch *
    - kubectl edit *
    - kubectl scale *
    - kubectl rollout *
    - kubectl cordon *
    - kubectl uncordon *
    - kubectl drain *
    - kubectl create *
    - kubectl replace *
    - kubectl label *
    - kubectl annotate *
    - kubectl taint *
